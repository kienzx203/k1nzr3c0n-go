  name: merge all passive sources → deduplicate + scope-filter
  depends_on:
  - p_subfinder
  - p_assetfinder
  - p_findomain
  - p_sublist3r
  - p_amass
  - p_chaos
  - p_oneforall
  - p_oneforall_extract
  - p_cero
