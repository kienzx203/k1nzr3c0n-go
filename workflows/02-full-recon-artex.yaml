- id: p_crtsh_psql
  name: passive — crt.sh via PostgreSQL (full CT set; deeper than the HTTP API)
  depends_on:
  - setup_subfinder_keys
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    touch {workspace}/p_crtsh_psql.txt
    command -v psql >/dev/null 2>&1 || { printf 'psql not installed — skipping crt.sh-psql\n'; exit 0; }
    # crt.sh public Postgres returns the FULL identity set the HTTP API truncates.
    # Server-side statement_timeout caps a slow scan; the step is optional anyway.
    PGCONNECT_TIMEOUT=20 psql -t -A -h crt.sh -p 5432 -U guest -d certwatch \
      -c "SET statement_timeout='120s'; SELECT ci.NAME_VALUE FROM certificate_and_identities ci WHERE ci.NAME_VALUE ILIKE '%.{target}';" \
      2>/dev/null \
      | tr '[:upper:]' '[:lower:]' | sed 's/^\*\.//; s/\.$//' \
      | grep -E "\.{target}$|^{target}$" | sort -u > {workspace}/p_crtsh_psql.txt || true
    touch {workspace}/p_crtsh_psql.txt
    printf 'crt.sh (psql) subs: %s\n' "$(wc -l < {workspace}/p_crtsh_psql.txt)"
  outputs:
    file: '{workspace}/p_crtsh_psql.txt'
