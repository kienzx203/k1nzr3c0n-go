    command -v github-subdomains >/dev/null 2>&1 || { printf 'github-subdomains not installed — skipping\n'; exit 0; }
    TOK="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
    test -n "$TOK" || { printf 'no GITHUB_TOKEN/GH_TOKEN — skipping github-subdomains\n'; exit 0; }
    github-subdomains -d {target} -t "$TOK" -o {workspace}/.gh_subs 2>/dev/null || true
    cat {workspace}/.gh_subs 2>/dev/null | tr '[:upper:]' '[:lower:]' | sed 's/^\*\.//; s/\.$//' \
      | grep -E "\.{target}$|^{target}$" | sort -u > {workspace}/p_github_subs.txt || true
    rm -f {workspace}/.gh_subs
    touch {workspace}/p_github_subs.txt
    printf 'github-subdomains subs: %s\n' "$(wc -l < {workspace}/p_github_subs.txt)"
  outputs:
    file: '{workspace}/p_github_subs.txt'
- id: p_columbus
  name: passive — columbus.elmasy.com (CT-based, keyless, fast, unique dataset)
  depends_on:
  - setup_subfinder_keys
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 3m
  run: |
    # columbus returns subdomain PREFIXES (array of labels) — append the root.
    curl -s --max-time 60 --retry 2 -H 'accept: text/plain' \
      "https://columbus.elmasy.com/api/lookup/{target}" 2>/dev/null \
      | tr '[:upper:]' '[:lower:]' \
      | sed 's/\.$//' \
      | awk 'NF{ if ($0 ~ /{target}$/) print $0; else print $0".{target}" }' \
      | grep -E "\.{target}$|^{target}$" | sort -u > {workspace}/p_columbus.txt || true
    touch {workspace}/p_columbus.txt
    printf 'columbus subs: %s\n' "$(wc -l < {workspace}/p_columbus.txt)"
  outputs:
    file: '{workspace}/p_columbus.txt'
- id: merge_passive
  name: merge all passive sources → deduplicate + scope-filter
  depends_on:
  - p_subfinder
  - p_assetfinder
  - p_findomain
  - p_sublist3r
  - p_amass
  - p_chaos
  - p_oneforall
  - p_oneforall_extract
  - p_cero
  - p_uncover
  - p_uncover_org
  - p_uncover_org_filter
  - p_waybackurls
  - p_gau
  - p_waymore
  - p_urlfinder
  - p_crtsh
  - p_certspotter
  - p_hackertarget
  - p_alienvault
  - p_rapiddns
  - p_gauplus
  - p_urlscan
  - p_github_code
  - p_securitytrails
  - p_virustotal
  - p_bevigil
  - p_shosubgo
  - p_threatcrowd
  - p_amass_active
  - axfr_check
  - p_subdomaincenter
  - p_crtsh_psql
  - p_github_subs
  - p_columbus
  run_on_failed_deps: true
  timeout: 5m
  shell: true
  run: |
    (
      printf '%s\n%s\n' "{target}" "www.{target}"
      cat \
        {workspace}/p_subfinder.txt \
        {workspace}/p_assetfinder.txt \
        {workspace}/p_findomain.txt \
        {workspace}/p_sublist3r.txt \
        {workspace}/p_amass.txt \
        {workspace}/p_chaos.txt \
        {workspace}/p_oneforall.txt \
        {workspace}/p_cero.txt \
        {workspace}/p_uncover.txt \
        {workspace}/p_uncover_org_in_scope.txt \
        {workspace}/p_waybackurls_subs.txt \
        {workspace}/p_gau_subs.txt \
        {workspace}/p_waymore_subs.txt \
        {workspace}/p_urlfinder_subs.txt \
        {workspace}/p_crtsh.txt \
        {workspace}/p_certspotter.txt \
        {workspace}/p_hackertarget.txt \
        {workspace}/p_alienvault.txt \
        {workspace}/p_rapiddns.txt \
        {workspace}/p_gauplus_subs.txt \
        {workspace}/p_urlscan.txt \
        {workspace}/p_github_code.txt \
        {workspace}/p_securitytrails.txt \
        {workspace}/p_virustotal.txt \
        {workspace}/p_bevigil.txt \
        {workspace}/p_shosubgo.txt \
        {workspace}/p_threatcrowd.txt \
        {workspace}/p_amass_active.txt \
        {workspace}/axfr_subs.txt \
        {workspace}/p_subdomaincenter.txt \
        {workspace}/p_crtsh_psql.txt \
        {workspace}/p_github_subs.txt \
        {workspace}/p_columbus.txt \
        2>/dev/null || true
      test -n '{vars.subdomains_list}' && test -f '{vars.subdomains_list}' && cat '{vars.subdomains_list}' || true
    ) | sed 's|https\?://||; s|/.*||; s|^\*\.||; s|\.$||; s|[[:space:]].*||' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" '$0==t || (length($0)>length(t) && substr($0,length($0)-length(t))==("." t))' \
      | sort -u > {workspace}/passive_merged.txt
  outputs:
    file: '{workspace}/passive_merged.txt'
  requires:
  - path: '{workspace}/passive_merged.txt'
    min_bytes: 1

- id: st_intel_retry
  name: '[intel] SecurityTrails top-up — refill sections lost to network flapping'
  depends_on:
  - merge_passive
  run_on_failed_deps: true
  when: '{vars.run_passive}'
  shell: true
  optional: true
  timeout: 15m
  # NAT dead windows usually kill only SOME sections of the --mode all run
  # (e.g. WHOIS/records die, subdomains survive). This tops up whatever is
  # still empty — 3 attempts per section, 20s apart. Runs AFTER merge_passive
  # so it never races the subdomain pipeline.
  run: |
    ST_KEY="${SECURITYTRAILS_KEY:-}"
    ST_COOKIE="${ST_COOKIE:-}"
    [ -z "$ST_KEY" ] && exit 0
    python3 ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/scripts/securitytrails_fetch.py "$ST_KEY" "{target}" \
      --mode all --out {workspace} --pivot-types ns,mx ${ST_COOKIE:+--cookie "$ST_COOKIE"} || true
    for f in st_dns_records.txt st_associated.txt st_pivot_domains.txt; do
      touch {workspace}/$f
    done
  outputs:
    file: '{workspace}/st_pivot_domains.txt'

- id: st_intel_mine
  name: '[intel] mine SecurityTrails intel (SSL cert SANs + historical DNS) for missed subs'
  depends_on:
  - st_intel_retry
  run_on_failed_deps: true
  shell: true
  optional: true
  timeout: 2m
  # st_subdomains already feeds merge_passive, but the REST of the ST intel
  # can hold hostnames the subdomain endpoint missed — historical cert SANs
  # (e.g. owa.* found via st_ssl.json on target) and old DNS record
  # values. Zero network calls: pure local parse, scope-filtered to {target}.
  # Runs AFTER st_intel_retry so topped-up sections are included too; feeds
  # merge_all_subdomains (NOT merge_passive, which runs before the retry).
  # NOTE: st_pivot_domains/st_associated are deliberately NOT mined — those
  # are other orgs' root domains and merging them would break scope.
  run: |
    python3 ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/scripts/st_intel_mine.py \
      {workspace} {target} 2>/dev/null || true
    touch {workspace}/st_intel_subs.txt
    printf 'ST intel mined subs: %s\n' "$(wc -l < {workspace}/st_intel_subs.txt)"
  outputs:
    file: '{workspace}/st_intel_subs.txt'

- id: recursive_enum
  name: '[passive] recursive subfinder — enumerate sub-subdomains of wildcard/broad hosts'
  depends_on:
  - merge_passive
  run_on_failed_deps: true
  when: '{vars.run_recursive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 60m
  run: |
    touch {workspace}/p_recursive.txt
    test -s {workspace}/passive_merged.txt || exit 0
    # Extract unique 2nd-level subdomains (e.g., cloud.target.com → enumerate *.cloud.target.com)
    # Find hosts with 3+ labels that could be wildcard parents.
    # Strip first label only (sed) so it works for any TLD depth (2-label: foo.com, 3-label: foo.com.vn)
    grep -oP '^[^.]+\.[^.]+\.{target}$' {workspace}/passive_merged.txt 2>/dev/null \
      | sed 's/^[^.]*\.//' | sort -u \
      | head -50 > {workspace}/recursive_parents.txt || true
    touch {workspace}/recursive_parents.txt
    if test -s {workspace}/recursive_parents.txt; then
      echo "[recursive] enumerating $(wc -l < {workspace}/recursive_parents.txt) parent domains (6-way parallel) ..."
      # xargs -P 6: parents are independent — the old sequential while-loop
      # spent ~5-10s per parent back-to-back (48 parents ≈ 8min → ~1.5min).
      TG=$(echo {target} | sed 's/\./\\./g')
      cat {workspace}/recursive_parents.txt | xargs -P 6 -I{} sh -c \
        'subfinder -d "$1" -silent -all -t 50 -timeout 30 2>/dev/null | grep -E "\.$2$" || true' _ {} "$TG" \
        >> {workspace}/p_recursive.txt || true
    fi
    sort -u -o {workspace}/p_recursive.txt {workspace}/p_recursive.txt
    printf 'recursive sub-subs found: %s\n' "$(wc -l < {workspace}/p_recursive.txt)"
  outputs:
    file: '{workspace}/p_recursive.txt'
- id: asn_discover
  name: '[ASN] metabigor — discover IP/CIDR ranges for org (local ASN DB, no API key)'
  depends_on:
  - recursive_enum
  run_on_failed_deps: true
  when: '{vars.run_asn}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: "(\n  echo '{target}' | metabigor net --domain 2>/dev/null || true;\n  test -n '{vars.org_name}' && echo '{vars.org_name}' | metabigor net --org 2>/dev/null || true\n) | grep -oE '[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]+' | sort -u > {workspace}/asn_ipv4_cidrs.txt || true; touch {workspace}/asn_ipv4_cidrs.txt; printf 'ASN IPv4 CIDRs discovered: %s\\n' \"$(wc -l < {workspace}/asn_ipv4_cidrs.txt)\" > {workspace}/asn_stats.txt"
  outputs:
    ipv4_cidrs: '{workspace}/asn_ipv4_cidrs.txt'
- id: amass_intel
  name: '[ASN] amass intel — org/WHOIS-based ASN discovery (amass v4 only; v5 uses metabigor)'
  depends_on:
  - asn_discover
  run_on_failed_deps: true
  when: '{vars.run_asn} && {vars.run_amass_intel} && {vars.org_name}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 15m
  run: |
    # amass intel subcommand was removed in v5 — use metabigor as fallback
    touch {workspace}/amass_intel.txt
    if amass intel -org "{vars.org_name}" -o {workspace}/amass_intel.txt 2>/dev/null; then
      echo "[amass_intel] amass intel completed"
    else
      # v5 fallback: use metabigor net --org for CIDR discovery
      echo "{vars.org_name}" | metabigor net --org 2>/dev/null \
        | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]+' \
        > {workspace}/amass_intel.txt || true
    fi
    touch {workspace}/amass_intel.txt
  outputs:
    file: '{workspace}/amass_intel.txt'
- id: amass_intel_extract
  name: '[ASN] extract CIDR ranges from amass intel output'
  depends_on:
  - amass_intel
  run_on_failed_deps: true
  timeout: 5m
  shell: true
  optional: true
  run: |
    grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]+' \
      {workspace}/amass_intel.txt 2>/dev/null | sort -u > {workspace}/amass_intel_cidrs.txt || true
    touch {workspace}/amass_intel_cidrs.txt
    printf 'amass intel CIDRs: %s\n' "$(wc -l < {workspace}/amass_intel_cidrs.txt)"
  outputs:
    file: '{workspace}/amass_intel_cidrs.txt'
- id: reverse_dns_asn
  name: '[ASN] hakrevdns — reverse DNS on ASN IP ranges → hidden subdomains not in CT'
  depends_on:
  - amass_intel_extract
  run_on_failed_deps: true
  when: '{vars.run_asn} && {vars.run_revdns}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 30m
  run: |
    touch {workspace}/reverse_dns_subs.txt
    test -s {workspace}/asn_ipv4_cidrs.txt || exit 0
    CIDR_COUNT=$(wc -l < {workspace}/asn_ipv4_cidrs.txt)
    if [ "$CIDR_COUNT" -gt 50 ]; then
      echo "[revdns skip] $CIDR_COUNT CIDRs too broad (CDN/cloud ASN), skipping"; exit 0
    fi
    echo "[revdns] expanding $CIDR_COUNT CIDRs → reverse DNS ..."
    # Expand CIDRs → IPs (cap at 65536), then reverse DNS lookup
    mapcidr -cl {workspace}/asn_ipv4_cidrs.txt -silent 2>/dev/null \
      | head -65536 \
      | hakrevdns -d -t 250 -r 1.1.1.1 2>/dev/null \
      | awk '{print $2}' \
      | sed 's/\.$//; s/^\*\.//' \
      | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
      | sort -u > {workspace}/reverse_dns_subs.txt || true
    touch {workspace}/reverse_dns_subs.txt
    printf 'Reverse DNS subs found: %s\n' "$(wc -l < {workspace}/reverse_dns_subs.txt)"
  outputs:
    file: '{workspace}/reverse_dns_subs.txt'
- id: permutation_dns
  name: subdomain permutation — dnsgen + alterx + gotator → GENERATE candidates only (NO resolve; agent resolves)
  depends_on:
  - reverse_dns_asn
  run_on_failed_deps: true
  timeout: 60m
  when: '{vars.run_permutation}'
  optional: true
  fanout_concurrency: 1
  fanout_timeout_default: 20m
  fanout:
  - id: dnsgen_resolve
    shell: true
    skip_if_exists: true
    timeout: 15m
    run: |
      printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n149.112.112.112\n208.67.222.222\n208.67.220.220\n64.6.64.6\n64.6.65.6\n84.200.69.80\n84.200.70.40\n185.228.168.9\n185.228.169.9\n77.88.8.8\n77.88.8.1\n156.154.70.1\n156.154.71.1\n198.101.242.72\n176.103.130.130\n' > {workspace}/resolvers.txt 2>/dev/null || true
      if test -s {workspace}/passive_merged.txt; then
        head -{vars.perm_input_limit} {workspace}/passive_merged.txt | dnsgen - 2>/dev/null \
          | head -{vars.perm_output_limit} \
          | sort -u > {workspace}/perm_dnsgen.txt || true
      fi
      touch {workspace}/perm_dnsgen.txt
      printf 'dnsgen permutations generated (no resolve): %s\n' "$(wc -l < {workspace}/perm_dnsgen.txt)"
    outputs:
      file: '{workspace}/perm_dnsgen.txt'
    optional: true
  - id: alterx_resolve
    shell: true
    skip_if_exists: true
    timeout: 15m
    run: |
      if test -s {workspace}/passive_merged.txt; then
        head -{vars.perm_input_limit} {workspace}/passive_merged.txt \
          | alterx -silent -limit {vars.perm_output_limit} 2>/dev/null \
          | sort -u > {workspace}/perm_alterx.txt || true
      fi
      touch {workspace}/perm_alterx.txt
      printf 'alterx permutations generated (no resolve): %s\n' "$(wc -l < {workspace}/perm_alterx.txt)"
    outputs:
      file: '{workspace}/perm_alterx.txt'
    optional: true
  - id: gotator_resolve
    shell: true
    skip_if_exists: true
    timeout: 20m
    run: |
      # gotator: smarter permutations — prefix/suffix/number increments + word mutations
      printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n149.112.112.112\n208.67.222.222\n208.67.220.220\n64.6.64.6\n64.6.65.6\n84.200.69.80\n84.200.70.40\n185.228.168.9\n185.228.169.9\n77.88.8.8\n77.88.8.1\n156.154.70.1\n156.154.71.1\n198.101.242.72\n176.103.130.130\n' > {workspace}/resolvers.txt 2>/dev/null || true
      if test -s {workspace}/passive_merged.txt; then
        # Limit input to perm_input_limit to avoid combinatorial explosion
        head -{vars.perm_input_limit} {workspace}/passive_merged.txt > {workspace}/gotator_input.txt || true
        gotator -sub {workspace}/gotator_input.txt \
          -depth {vars.gotator_depth} -numbers 3 -md \
          -mindup -t 200 -silent 2>/dev/null \
          | grep -E "\.{target}$" \
          | head -{vars.perm_output_limit} \
          | sort -u > {workspace}/perm_gotator.txt || true
      fi
      touch {workspace}/perm_gotator.txt
      printf 'gotator permutations generated (no resolve): %s\n' "$(wc -l < {workspace}/perm_gotator.txt)"
    outputs:
      file: '{workspace}/perm_gotator.txt'
    optional: true
- id: merge_all_subdomains
  name: merge passive + permutation + revdns + recursive + amass intel + ST intel → final candidate list
  depends_on:
  - permutation_dns
  - st_intel_mine
  run_on_failed_deps: true
  timeout: 5m
  shell: true
  run: |
    PASSIVE=$(wc -l < {workspace}/passive_merged.txt 2>/dev/null || echo 0)
    PERM=$(cat {workspace}/perm_dnsgen.txt {workspace}/perm_alterx.txt {workspace}/perm_gotator.txt 2>/dev/null | wc -l || echo 0)
    (
      cat {workspace}/passive_merged.txt      2>/dev/null || true
      cat {workspace}/p_recursive.txt         2>/dev/null || true
      cat {workspace}/amass_intel.txt         2>/dev/null || true
      cat {workspace}/st_intel_subs.txt       2>/dev/null || true
      cat \
        {workspace}/perm_dnsgen.txt \
        {workspace}/perm_alterx.txt \
        {workspace}/perm_gotator.txt \
        {workspace}/reverse_dns_subs.txt \
        2>/dev/null || true
    ) | sed 's|https\?://||; s|/.*||; s|^\*\.||; s|\.$||; s|[[:space:]].*||' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" '$0==t || (length($0)>length(t) && substr($0,length($0)-length(t))==("." t))' \
      | sort -u > {workspace}/subdomains_all.txt
    TOTAL=$(wc -l < {workspace}/subdomains_all.txt)
    printf 'merge_all: passive=%s perm=%s → total_unique=%s\n' "$PASSIVE" "$PERM" "$TOTAL"
  outputs:
    subdomains_all: '{workspace}/subdomains_all.txt'
  requires:
  - path: '{workspace}/subdomains_all.txt'
    min_bytes: 1

- id: tlsx_san_mine
  name: '[TLS] tlsx — scan live hosts for certificates, extract SAN entries'
  depends_on:
  - merge_all_subdomains
  run_on_failed_deps: true
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 20m
  run: |
    # Input: resolved hosts (wildcard mode). In no-wildcard mode that file is
    # empty (mass resolve was skipped) → fall back to the candidate list, else
    # TLS-SAN discovery would be silently skipped for MOST targets (capped:
    # handshakes on dead hosts cost time; 5000 is plenty for SAN mining).
    TLSX_INPUT={workspace}/subdomains_resolved.txt
    if ! test -s "$TLSX_INPUT"; then
      head -5000 {workspace}/subdomains_all.txt > {workspace}/.tlsx_candidates 2>/dev/null || true
      TLSX_INPUT={workspace}/.tlsx_candidates
    fi
    test -s "$TLSX_INPUT" && tlsx -l "$TLSX_INPUT" \
      -san -cn -silent \
      -p 443,8443,4443 \
      -timeout 5 \
      -o {workspace}/tlsx_raw.txt 2>/dev/null || true
    TLSX_CNT=$(wc -l < "$TLSX_INPUT" 2>/dev/null || echo 0)
    rm -f {workspace}/.tlsx_candidates
    touch {workspace}/tlsx_raw.txt
    printf 'tlsx SAN mining input: %s hosts | raw SAN lines: %s\n' "$TLSX_CNT" "$(wc -l < {workspace}/tlsx_raw.txt 2>/dev/null || echo 0)"
  outputs:
    file: '{workspace}/tlsx_raw.txt'
- id: tlsx_san_extract
  name: '[TLS] extract new in-scope subdomains from TLS SAN entries'
  depends_on:
  - tlsx_san_mine
  run_on_failed_deps: true
  timeout: 5m
  when: '{vars.run_tlsx}'
  shell: true
  optional: true
  run: |
    sed 's/\x1b\[[0-9;]*m//g' {workspace}/tlsx_raw.txt 2>/dev/null \
      | grep -oP '(?<=\[)[^\]]+(?=\])' \
      | sed 's/^\*\.//' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" '$0==t || (length($0)>length(t) && substr($0,length($0)-length(t))==("." t))' \
      | sort -u > {workspace}/tlsx_all_subs.txt || true
    comm -23 \
      <(sort {workspace}/tlsx_all_subs.txt 2>/dev/null || true) \
      <(sort {workspace}/subdomains_resolved.txt 2>/dev/null || true) \
      > {workspace}/tlsx_new_subs.txt 2>/dev/null || touch {workspace}/tlsx_new_subs.txt
    touch {workspace}/tlsx_new_subs.txt
    printf 'TLS SAN new subs discovered: %s\n' "$(wc -l < {workspace}/tlsx_new_subs.txt)" >> {workspace}/resolve_stats.txt || true
  outputs:
    file: '{workspace}/tlsx_new_subs.txt'
- id: final_report
  name: finalize discovery — union all names into subdomains.txt (no resolve/probe)
  depends_on:
  - tlsx_san_extract
  run_on_failed_deps: true
  timeout: 5m
  shell: true
  run: |
    mkdir -p {workspace}/report
    # Union every DISCOVERED subdomain NAME (passive + permutation + intel +
    # reverse-DNS + cert-SAN). NO resolve, NO httpx — the agent probes these.
    # Written to subdomains.txt because ParseWorkspace ingests THAT file (or
    # subdomains_resolved.txt) as subdomain assets → visible via recon_assets.
    ( cat {workspace}/subdomains_all.txt 2>/dev/null || true
      cat {workspace}/tlsx_all_subs.txt  2>/dev/null || true
    ) | sed 's|https\?://||; s|/.*||; s|^\*\.||; s|\.$||; s|[[:space:]].*||' \
      | tr '[:upper:]' '[:lower:]' \
      | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
      | awk -v t="{target}" '$0==t || (length($0)>length(t) && substr($0,length($0)-length(t))==("." t))' \
      | sort -u > {workspace}/subdomains.txt
    touch {workspace}/subdomains.txt
    COUNT=$(wc -l < {workspace}/subdomains.txt)
    {
      printf '# K1NZR3C0N \xe2\x80\x94 Subdomain Discovery (names only, no resolve/probe)\n'
      printf '**Target:** {target}\n\n'
      printf 'In-scope subdomain names discovered: %s\n\n' "$COUNT"
      printf 'These are NAMES ONLY \xe2\x80\x94 not resolved, not probed. The agent resolves + httpx + port-scans + probes them.\n\n'
      printf 'Key files:\n'
      printf -- '- `subdomains.txt` \xe2\x80\x94 all in-scope discovered names (ingested as assets; feed to resolve/httpx)\n'
      printf -- '- `subdomains_all.txt` \xe2\x80\x94 raw candidate union (passive + permutation)\n'
      printf -- '- `tlsx_all_subs.txt` \xe2\x80\x94 subdomains from TLS cert SANs\n'
      printf -- '- `asn_ipv4_cidrs.txt` \xe2\x80\x94 org ASN/CIDR ranges (if run_asn)\n'
    } > {workspace}/report/summary.md
    printf '\n=== DISCOVERY COMPLETE: %s subdomains ===\n' "$COUNT"
    cat {workspace}/report/summary.md
  outputs:
    summary: '{workspace}/report/summary.md'
    subdomains: '{workspace}/subdomains.txt'
