  name: passive — github-subdomains (deep code dork; needs GITHUB_TOKEN)
  depends_on:
  - setup_subfinder_keys
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
