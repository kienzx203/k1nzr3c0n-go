- id: p_urlscan
  name: '[passive] urlscan.io — global scan index (finds subs from security researcher scans)'
  depends_on:
  - setup_subfinder_keys
  run_on_failed_deps: true
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 5m
  run: |
    # Paginate using correct `from` offset (not search_after cursor — that requires prev response)
    # Authenticated via URLSCAN_API_KEY if available (1000/day quota; public = 120/min limit)
    > {workspace}/p_urlscan.txt
    URLSCAN_HEADER=""
    [ -n "${URLSCAN_API_KEY:-}" ] && URLSCAN_HEADER="-H API-Key:${URLSCAN_API_KEY}"
    PAGE_SIZE=100
    MAX_RESULTS=1000
    OFFSET=0
    while [ "$OFFSET" -lt "$MAX_RESULTS" ]; do
      # 3 attempts with backoff — urlscan public tier 429s bursty NAT egress;
      # a dead first page used to abort the loop with 0 results.
      for TRY in 1 2 3; do
        RESP=$(curl -sL $URLSCAN_HEADER \
          "https://urlscan.io/api/v1/search/?q=domain:{target}&size=${PAGE_SIZE}&from=${OFFSET}" \
          --max-time 20 2>/dev/null)
        COUNT=$(echo "$RESP" | jq '.results | length' 2>/dev/null || echo 0)
        COUNT=${COUNT:-0}
        [ "$COUNT" -gt 0 ] && break
        sleep $((TRY * 10))
      done
      [ "$COUNT" -le 0 ] && break
      echo "$RESP" | jq -r '.results[].page.domain // empty' 2>/dev/null \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" >> {workspace}/p_urlscan.txt || true
      TOTAL=$(echo "$RESP" | jq -r '.total // 0' 2>/dev/null || echo 0)
      TOTAL=${TOTAL:-0}
      OFFSET=$((OFFSET + PAGE_SIZE))
      [ "$OFFSET" -ge "$TOTAL" ] && break
      [ "$COUNT" -lt "$PAGE_SIZE" ] && break
    done
    sort -u -o {workspace}/p_urlscan.txt {workspace}/p_urlscan.txt
    touch {workspace}/p_urlscan.txt
    printf 'urlscan.io subs: %s\n' "$(wc -l < {workspace}/p_urlscan.txt)"
  outputs:
    file: '{workspace}/p_urlscan.txt'
- id: p_github_code
  name: '[passive] github code search — find hardcoded subdomains in public repos (uses GITHUB_TOKEN)'
  depends_on:
  - setup_subfinder_keys
  run_on_failed_deps: true
  when: '{vars.run_passive}'
  shell: true
  optional: true
  skip_if_exists: true
  timeout: 10m
  run: |
    GH_TOKEN="${GITHUB_TOKEN:-}"
    touch {workspace}/p_github_code.txt
    if [ -z "$GH_TOKEN" ]; then
      echo "[github_code] GITHUB_TOKEN not set — skipping (set in .env for up to 5000 req/hr)"; exit 0
    fi
    # Check if github-subdomains binary is available (installed in image)
    if command -v github-subdomains >/dev/null 2>&1; then
      github-subdomains -d {target} -raw -t "$GH_TOKEN" 2>/dev/null \
        | grep -E "(^|\.)$(echo {target} | sed 's/\./\\./g')$" \
        | sort -u > {workspace}/p_github_code.txt || true
    else
      # Fallback: GitHub Search API directly (3 search queries)
      for QUERY in "$(echo {target})" "\"https://\" \".{target}\"" "\".{target}\" in:file"; do
        curl -sL "https://api.github.com/search/code?q=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$QUERY'))")&per_page=100" \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3.text-match+json" \
          --max-time 30 2>/dev/null \
          | jq -r '.items[].text_matches[]?.fragment // empty' 2>/dev/null \
          | grep -oE '[a-zA-Z0-9_.-]+\.{target}' >> {workspace}/p_github_code.txt || true
        sleep 2  # GitHub search rate limit
      done
      sort -u -o {workspace}/p_github_code.txt {workspace}/p_github_code.txt
    fi
    touch {workspace}/p_github_code.txt
    printf 'GitHub code subs: %s\n' "$(wc -l < {workspace}/p_github_code.txt)"
  outputs:
    file: '{workspace}/p_github_code.txt'
- id: p_securitytrails
  name: '[passive] SecurityTrails FULL intel — subdomains + DNS + WHOIS + SSL + pivot'
  depends_on:
  - setup_subfinder_keys
  run_on_failed_deps: true
  when: '{vars.run_passive}'
  shell: true
  optional: true
  timeout: 20m
  # Single --mode all call pulls EVERYTHING the ST API exposes for the target:
  #   st_subdomains.txt → copied to p_securitytrails.txt (feeds merge_passive)
  #   st_dns_records.txt, st_domain_info.json, st_whois.json,
  #   st_whois_history.json, st_ssl.json, st_associated.txt,
  #   st_pivot_domains.txt (domains sharing NS/MX — INTEL leads only, they do
  #   NOT enter the scan pipeline; review them, register interesting ones
  #   under Targets). View everything in the run's "ST Intel" tab.
  run: |
    ST_KEY="${SECURITYTRAILS_KEY:-}"
    ST_COOKIE="${ST_COOKIE:-}"
    [ -z "$ST_KEY" ] && echo "[securitytrails] no key — skipping" && touch {workspace}/p_securitytrails.txt && exit 0
    python3 ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/scripts/securitytrails_fetch.py "$ST_KEY" "{target}" \
      --mode all --out {workspace} --pivot-types ns,mx ${ST_COOKIE:+--cookie "$ST_COOKIE"} || true
    if [ -s {workspace}/st_subdomains.txt ]; then
      sort -u {workspace}/st_subdomains.txt > {workspace}/p_securitytrails.txt
    else
      touch {workspace}/p_securitytrails.txt
    fi
    for f in st_dns_records.txt st_associated.txt st_pivot_domains.txt; do
      touch {workspace}/$f
    done
    printf 'SecurityTrails: %s subdomains, %s dns records, %s associated, %s pivot domains\n' \
      "$(wc -l < {workspace}/p_securitytrails.txt)" "$(wc -l < {workspace}/st_dns_records.txt)" \
      "$(wc -l < {workspace}/st_associated.txt)" "$(wc -l < {workspace}/st_pivot_domains.txt)"
  outputs:
    file: '{workspace}/p_securitytrails.txt'
