name: 02-js-secrets-recon
description: 'JS & secrets recon: probe → crawl (katana+hakrawler+waybackurls) → collect JS → endpoints/secrets → nuclei keys/exposures → gf patterns → dirsearch+ferox+gobuster → report'
vars:
  run_archive: 'true'
  run_linkfinder: 'true'
  run_jsubfinder: 'true'
  run_secretfinder: 'true'
  run_swaggerspy: 'true'
  run_static_secrets: 'true'
  run_nuclei_js: 'true'
  run_gf: 'true'
  run_dirbrute: 'true'
  ffuf_path_threads: '40'
  katana_depth: '5'
  katana_concurrency: '20'
  katana_timeout: 15m
  httpx_threads: '50'
  nuclei_rl: '100'
  nuclei_timeout: '10'
  dir_wordlist: ${K1NZR3C0N_BASE:-/opt/k1nzr3c0n}/wordlists/common.txt
  dirsearch_threads: '30'
  ferox_threads: '50'
steps:
- id: httpx_probe
  name: '[probe] httpx — fingerprint target: status / title / tech'
  shell: true
  skip_if_exists: true
  timeout: 2m
  run: 'echo ''{target}'' | httpx -silent -json -title -tech-detect -status-code -content-length -follow-redirects -threads {vars.httpx_threads} -o {workspace}/httpx_probe.jsonl 2>/dev/null || true; touch {workspace}/httpx_probe.jsonl; TECH=$(jq -r ''.tech[]?'' {workspace}/httpx_probe.jsonl 2>/dev/null | sort -u | tr ''\n'' '','' | sed ''s/,$//''); printf ''Target  : {target}\nTech    : %s\n'' "${TECH:-unknown}" > {workspace}/stats.txt'
  outputs:
    probe: '{workspace}/httpx_probe.jsonl'
  _phase: scan
- id: katana_crawl
  name: '[crawl] katana — deep JS-aware crawl (jc + kf all)'
  shell: true
  skip_if_exists: true
  timeout: 15m
  run: 'katana -u {target} -d {vars.katana_depth} -c {vars.katana_concurrency} -ct {vars.katana_timeout} -jc -kf all -silent -o {workspace}/katana_urls.txt 2>/dev/null || true; touch {workspace}/katana_urls.txt; printf ''katana       : %s URLs\n'' "$(wc -l < {workspace}/katana_urls.txt)" >> {workspace}/stats.txt'
  outputs:
    urls: '{workspace}/katana_urls.txt'
  _phase: crawl
- id: hakrawler_crawl
  name: '[crawl] hakrawler — recursive crawl additional pass'
  shell: true
  skip_if_exists: true
  optional: true
  timeout: 10m
  run: 'echo ''{target}'' | hakrawler -depth 4 -plain -insecure 2>/dev/null | sort -u > {workspace}/hakrawler_urls.txt || true; touch {workspace}/hakrawler_urls.txt; printf ''hakrawler    : %s URLs\n'' "$(wc -l < {workspace}/hakrawler_urls.txt)" >> {workspace}/stats.txt'
  outputs:
    urls: '{workspace}/hakrawler_urls.txt'
  _phase: crawl
- id: archive_urls
  name: '[crawl] gau + waymore + waybackurls — archived URL discovery'
  when: '{vars.run_archive}'
  optional: true
  skip_if_exists: true
  fanout_concurrency: 3
  fanout_timeout_default: 20m
  fanout:
  - id: gau_fetch
    shell: true
    skip_if_exists: true
    optional: true
    run: |
      DOMAIN=$(echo '{target}' | sed 's|https\?://||' | cut -d/ -f1 | cut -d: -f1)
      gau "$DOMAIN" --subs --threads 5 --timeout 30 --providers otx,urlscan 2>/dev/null | sort -u > {workspace}/gau_urls.txt || true
      touch {workspace}/gau_urls.txt
      printf 'gau          : %s URLs\n' "$(wc -l < {workspace}/gau_urls.txt)" >> {workspace}/stats.txt
    outputs:
      urls: '{workspace}/gau_urls.txt'
  - id: waymore_fetch
    shell: true
    skip_if_exists: true
    optional: true
    timeout: 15m
    run: |
      DOMAIN=$(echo '{target}' | sed 's|https\?://||' | cut -d/ -f1 | cut -d: -f1)
      waymore -i "$DOMAIN" -mode U -oU {workspace}/waymore_urls.txt -t 120 2>/dev/null || true
      touch {workspace}/waymore_urls.txt
      printf 'waymore      : %s URLs\n' "$(wc -l < {workspace}/waymore_urls.txt)" >> {workspace}/stats.txt
    outputs:
      urls: '{workspace}/waymore_urls.txt'
  - id: waybackurls_fetch
    shell: true
    skip_if_exists: true
    optional: true
    run: |
      DOMAIN=$(echo '{target}' | sed 's|https\?://||' | cut -d/ -f1 | cut -d: -f1)
      echo "$DOMAIN" | timeout 30 waybackurls 2>/dev/null | sort -u > {workspace}/waybackurls_urls.txt || true
      touch {workspace}/waybackurls_urls.txt
      printf 'waybackurls  : %s URLs\n' "$(wc -l < {workspace}/waybackurls_urls.txt)" >> {workspace}/stats.txt
    outputs:
      urls: '{workspace}/waybackurls_urls.txt'
  _phase: crawl
- id: urlfinder_crawl
  name: '[crawl] urlfinder — passive URL collection'
  when: '{vars.run_archive}'
  optional: true
  skip_if_exists: true
  timeout: 10m
  shell: true
  run: 'DOMAIN=$(echo ''{target}'' | sed ''s|https\?://||'' | cut -d/ -f1 | cut -d: -f1); urlfinder -d "$DOMAIN" -silent -es waybackarchive -o {workspace}/urlfinder_urls.txt 2>/dev/null || true; touch {workspace}/urlfinder_urls.txt; printf ''urlfinder    : %s URLs\n'' "$(wc -l < {workspace}/urlfinder_urls.txt)" >> {workspace}/stats.txt'
  outputs:
    urls: '{workspace}/urlfinder_urls.txt'
  _phase: crawl
- id: merge_all_urls
  name: merge all crawled + archived URLs
  depends_on:
  - katana_crawl
  - hakrawler_crawl
  - archive_urls
  - urlfinder_crawl
  # Engine treats SKIPPED deps as failed — when e.g. run_archive=false this
  # merge step (and the whole downstream JS chain) would skip even though
  # katana/hakrawler produced output. The cat fallbacks below already tolerate
  # missing files.
  run_on_failed_deps: true
  shell: true
  run: '(cat {workspace}/katana_urls.txt 2>/dev/null; cat {workspace}/hakrawler_urls.txt 2>/dev/null; cat {workspace}/gau_urls.txt 2>/dev/null; cat {workspace}/waymore_urls.txt 2>/dev/null; cat {workspace}/waybackurls_urls.txt 2>/dev/null; cat {workspace}/urlfinder_urls.txt 2>/dev/null) | sort -u > {workspace}/all_urls.txt || true; touch {workspace}/all_urls.txt; printf ''Total URLs   : %s\n'' "$(wc -l < {workspace}/all_urls.txt)" >> {workspace}/stats.txt'
  outputs:
    all_urls: '{workspace}/all_urls.txt'
  _phase: crawl
- id: subjs_collect
  name: '[js] subjs — extract all JS file URLs'
  depends_on:
  - merge_all_urls
  shell: true
  skip_if_exists: true
  timeout: 10m
  run: '(test -s {workspace}/all_urls.txt && subjs -i {workspace}/all_urls.txt -c 20 -t 15 2>/dev/null || true; echo ''{target}'' | subjs -c 20 -t 15 2>/dev/null || true; grep -iE ''\.js(\?.*)?$'' {workspace}/all_urls.txt 2>/dev/null || true) | grep -iE ''https?://'' | grep -iE ''\.js(\?.*)?$'' | sort -u > {workspace}/js_urls.txt || true; touch {workspace}/js_urls.txt; printf ''JS URLs      : %s\n'' "$(wc -l < {workspace}/js_urls.txt)" >> {workspace}/stats.txt'
  outputs:
    js_urls: '{workspace}/js_urls.txt'
  _phase: crawl
- id: download_js
  name: '[js] download top-150 JS files for static analysis'
  depends_on:
  - subjs_collect
  shell: true
  skip_if_exists: true
  optional: true
  timeout: 15m
  run: |
    mkdir -p {workspace}/js_files
    if test -s {workspace}/js_urls.txt; then
      # Parallel downloads (10 concurrent). The old sequential loop took up to
      # 150 x curl --max-time 15 = ~37 min worst case — longer than the step
      # timeout, which failed this step and skipped every downstream JS scan.
      head -150 {workspace}/js_urls.txt | xargs -d '\n' -n 1 -P 10 sh -c '
        url="$1"
        fname=$(printf "%s" "$url" | md5sum | cut -d" " -f1)
        curl -skL --max-time 15 -A "Mozilla/5.0" "$url" -o "{workspace}/js_files/$fname.js" 2>/dev/null || true
      ' _
    fi
    find {workspace}/js_files/ -empty -delete 2>/dev/null || true
    printf 'JS downloaded: %s\n' "$(ls {workspace}/js_files/*.js 2>/dev/null | wc -l)" >> {workspace}/stats.txt
  outputs:
    js_dir: '{workspace}/js_files'
  _phase: crawl
- id: linkfinder_scan
  name: '[js] LinkFinder — extract endpoints/paths from JS'
  depends_on:
  - subjs_collect
  when: '{vars.run_linkfinder}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: 'DOMAIN=$(echo ''{target}'' | sed ''s|https\?://||'' | cut -d/ -f1 | cut -d: -f1); linkfinder -d "$DOMAIN" -o cli 2>/dev/null | grep -v ''^#'' | grep -v ''^\s*$'' | sort -u > {workspace}/linkfinder_endpoints.txt || true; touch {workspace}/linkfinder_endpoints.txt; printf ''LinkFinder   : %s endpoints\n'' "$(wc -l < {workspace}/linkfinder_endpoints.txt)" >> {workspace}/stats.txt'
  outputs:
    endpoints: '{workspace}/linkfinder_endpoints.txt'
  _phase: crawl
- id: jsapiscan_scan
  name: '[js] jsapiscan — extract API endpoints from JS files'
  depends_on:
  - subjs_collect
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: 'test -s {workspace}/js_urls.txt && mkdir -p {workspace}/jsapiscan_out && cd {workspace}/jsapiscan_out && jsapiscan -f {workspace}/js_urls.txt -o {workspace}/jsapiscan_results.txt -K -t 20 -d 2 2>/dev/null || true; touch {workspace}/jsapiscan_results.txt; printf ''jsapiscan    : %s API endpoints\n'' "$(wc -l < {workspace}/jsapiscan_results.txt)" >> {workspace}/stats.txt'
  outputs:
    results: '{workspace}/jsapiscan_results.txt'
  _phase: crawl
- id: jsubfinder_scan
  name: '[js] jsubfinder — crawl JS for subdomains + secrets'
  depends_on:
  - subjs_collect
  when: '{vars.run_jsubfinder}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: 'jsubfinder search -u {target} -c --output-file {workspace}/jsubfinder_subs.txt --secrets {workspace}/jsubfinder_secrets.txt -S 2>/dev/null || true; touch {workspace}/jsubfinder_subs.txt {workspace}/jsubfinder_secrets.txt; printf ''jsubfinder   : %s secrets / %s subdomains\n'' "$(wc -l < {workspace}/jsubfinder_secrets.txt)" "$(wc -l < {workspace}/jsubfinder_subs.txt)" >> {workspace}/stats.txt'
  outputs:
    secrets: '{workspace}/jsubfinder_secrets.txt'
    subdomains: '{workspace}/jsubfinder_subs.txt'
  _phase: crawl
- id: secretfinder_scan
  name: '[js] SecretFinder — API keys/tokens/credentials in downloaded JS'
  depends_on:
  - download_js
  when: '{vars.run_secretfinder}'
  optional: true
  skip_if_exists: true
  timeout: 20m
  shell: true
  run: ": > {workspace}/secretfinder_results.txt; for f in {workspace}/js_files/*.js; do\n  test -f \"$f\" || continue;\n  python3 /opt/SecretFinder/SecretFinder.py -i \"$f\" -o cli 2>/dev/null || true;\ndone | grep -v '^\\s*$' | sort -u >> {workspace}/secretfinder_results.txt || true; touch {workspace}/secretfinder_results.txt; printf 'SecretFinder : %s findings\\n' \"$(wc -l < {workspace}/secretfinder_results.txt)\" >> {workspace}/stats.txt"
  outputs:
    results: '{workspace}/secretfinder_results.txt'
  _phase: vuln
- id: swaggerspy_scan
  name: '[secrets] SwaggerSpy — leaked SwaggerHub API specs OSINT + secret scan'
  when: '{vars.run_swaggerspy}'
  optional: true
  skip_if_exists: true
  timeout: 15m
  shell: true
  run: |
    # SwaggerHub OSINT: search the target domain on app.swaggerhub.com,
    # download every matching API spec, regex-scan for ~40 secret patterns
    # (AWS/GCP/Stripe/Slack keys, JWTs, private keys, creds, emails, IPs).
    # Fully passive — queries SwaggerHub only, never the target itself.
    DOMAIN=$(echo '{target}' | sed 's|https\?://||' | cut -d/ -f1 | cut -d: -f1)
    timeout 800 swaggerspy "$DOMAIN" 2>/dev/null \
      | sed 's/\x1b\[[0-9;]*m//g' > {workspace}/swaggerspy_results.txt || true
    touch {workspace}/swaggerspy_results.txt
    DOCS=$(grep '^URL: ' {workspace}/swaggerspy_results.txt 2>/dev/null | wc -l)
    SECRETS=$(grep -E '^\[\*\]' {workspace}/swaggerspy_results.txt 2>/dev/null | grep -v 'Found' | wc -l)
    printf 'SwaggerSpy   : %s API docs / %s secret matches\n' "$DOCS" "$SECRETS" >> {workspace}/stats.txt
  outputs:
    results: '{workspace}/swaggerspy_results.txt'
  _phase: vuln
- id: static_secret_scan
  name: '[secrets] TruffleHog + Gitleaks — deep secret scan on downloaded JS files'
  depends_on:
  - download_js
  when: '{vars.run_static_secrets}'
  optional: true
  fanout_concurrency: 2
  fanout_timeout_default: 20m
  fanout:
  - id: trufflehog_scan
    shell: true
    skip_if_exists: true
    optional: true
    run: 'test -d {workspace}/js_files || { touch {workspace}/trufflehog_results.jsonl; exit 0; }; trufflehog filesystem {workspace}/js_files/ --json --no-update 2>/dev/null | grep -v ''^\s*$'' > {workspace}/trufflehog_results.jsonl || true; touch {workspace}/trufflehog_results.jsonl; FOUND=$(wc -l < {workspace}/trufflehog_results.jsonl 2>/dev/null || echo 0); printf ''TruffleHog   : %s secrets\n'' "$FOUND" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/trufflehog_results.jsonl'
  - id: gitleaks_scan
    shell: true
    skip_if_exists: true
    optional: true
    run: 'test -d {workspace}/js_files || { touch {workspace}/gitleaks_results.json; exit 0; }; gitleaks detect --source {workspace}/js_files/ --no-git --report-path {workspace}/gitleaks_results.json --report-format json -q 2>/dev/null || true; touch {workspace}/gitleaks_results.json; FOUND=$(jq ''if type=="array" then length else 0 end'' {workspace}/gitleaks_results.json 2>/dev/null || echo 0); printf ''Gitleaks     : %s findings\n'' "$FOUND" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/gitleaks_results.json'
  _phase: vuln
- id: nuclei_js_secrets
  name: '[nuclei] API key / token / exposure scanning (3 parallel)'
  depends_on:
  - subjs_collect
  - download_js
  when: '{vars.run_nuclei_js}'
  optional: true
  fanout_concurrency: 3
  fanout_timeout_default: 25m
  fanout:
  - id: nuclei_file_keys
    shell: true
    skip_if_exists: true
    optional: true
    run: 'find {workspace}/js_files/ -name ''*.js'' 2>/dev/null | nuclei -t /root/nuclei-templates/file/keys/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_file_keys.jsonl 2>/dev/null || true; touch {workspace}/nuclei_file_keys.jsonl; printf ''nuclei keys  : %s findings\n'' "$(wc -l < {workspace}/nuclei_file_keys.jsonl)" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/nuclei_file_keys.jsonl'
  - id: nuclei_js_urls
    shell: true
    skip_if_exists: true
    optional: true
    run: 'test -s {workspace}/js_urls.txt && nuclei -l {workspace}/js_urls.txt -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_js_exposure.jsonl 2>/dev/null || true; touch {workspace}/nuclei_js_exposure.jsonl; printf ''nuclei js    : %s findings\n'' "$(wc -l < {workspace}/nuclei_js_exposure.jsonl)" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/nuclei_js_exposure.jsonl'
  - id: nuclei_target_exposure
    shell: true
    skip_if_exists: true
    optional: true
    run: 'echo ''{target}'' | nuclei -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_target_exposure.jsonl 2>/dev/null || true; touch {workspace}/nuclei_target_exposure.jsonl; printf ''nuclei target: %s findings\n'' "$(wc -l < {workspace}/nuclei_target_exposure.jsonl)" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/nuclei_target_exposure.jsonl'
  _phase: vuln
- id: gf_patterns
  name: '[gf] jsvar / params / lfi / ssrf / xss / sqli / idor / rce / redirect'
  depends_on:
  - merge_all_urls
  when: '{vars.run_gf}'
  optional: true
  shell: true
  run: |
    mkdir -p {workspace}/gf
    test -s {workspace}/all_urls.txt || { touch {workspace}/gf/.done; exit 0; }
    for pat in jsvar interestingparams interestingEXT lfi ssrf redirect xss sqli idor rce; do
      gf "$pat" < {workspace}/all_urls.txt > {workspace}/gf/$pat.txt 2>/dev/null || true
      touch {workspace}/gf/$pat.txt
      CNT=$(wc -l < {workspace}/gf/$pat.txt 2>/dev/null || echo 0)
      test "$CNT" -gt 0 && printf 'gf %-18s: %s\n' "$pat" "$CNT" >> {workspace}/stats.txt || true
    done
  outputs:
    gf_dir: '{workspace}/gf'
  _phase: process
- id: dirbrute
  name: '[brute] dirsearch + ffuf + feroxbuster + gobuster — dir brute (4 parallel)'
  depends_on:
  - httpx_probe
  when: '{vars.run_dirbrute}'
  optional: true
  fanout_concurrency: 4
  fanout_timeout_default: 30m
  fanout:
  - id: dirsearch_run
    shell: true
    skip_if_exists: true
    optional: true
    run: 'dirsearch -u {target} -w {vars.dir_wordlist} -t {vars.dirsearch_threads} -o {workspace}/dirsearch.txt --format=plain --exclude-status=404 -q 2>/dev/null || true; touch {workspace}/dirsearch.txt; printf ''dirsearch    : %s paths\n'' "$(wc -l < {workspace}/dirsearch.txt)" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/dirsearch.txt'
  - id: ffuf_path_run
    shell: true
    skip_if_exists: true
    optional: true
    run: 'ffuf -u {target}/FUZZ -w {vars.dir_wordlist} -t {vars.ffuf_path_threads} -mc 200,201,204,301,302,307,401,403,405,500 -of json -o {workspace}/ffuf_paths.json -s 2>/dev/null || true; touch {workspace}/ffuf_paths.json; FF=$(jq -r ''.results[]?.url'' {workspace}/ffuf_paths.json 2>/dev/null | wc -l || echo 0); printf ''ffuf paths   : %s paths\n'' "$FF" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/ffuf_paths.json'
  - id: feroxbuster_run
    shell: true
    skip_if_exists: true
    optional: true
    run: 'feroxbuster -u {target} -w {vars.dir_wordlist} -t {vars.ferox_threads} --silent --json --extract-links --collect-words -o {workspace}/feroxbuster.json 2>/dev/null || true; touch {workspace}/feroxbuster.json; FOUND=$(jq -r ''select(.type=="response" and .status!=404) | .url'' {workspace}/feroxbuster.json 2>/dev/null | wc -l || echo 0); printf ''feroxbuster  : %s paths\n'' "$FOUND" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/feroxbuster.json'
  - id: gobuster_run
    shell: true
    skip_if_exists: true
    optional: true
    run: 'gobuster dir -u {target} -w {vars.dir_wordlist} -t 50 -q --no-error -o {workspace}/gobuster_dir.txt 2>/dev/null || true; touch {workspace}/gobuster_dir.txt; printf ''gobuster     : %s paths\n'' "$(wc -l < {workspace}/gobuster_dir.txt)" >> {workspace}/stats.txt'
    outputs:
      results: '{workspace}/gobuster_dir.txt'
  _phase: brute
- id: merge_endpoints
  name: merge all endpoints — JS + dir brute + crawl
  depends_on:
  - linkfinder_scan
  - jsapiscan_scan
  - gf_patterns
  - dirbrute
  shell: true
  run: '(cat {workspace}/linkfinder_endpoints.txt 2>/dev/null; cat {workspace}/jsapiscan_results.txt 2>/dev/null; grep -oP ''/[a-zA-Z0-9/_\-\.%?=&]+'' {workspace}/all_urls.txt 2>/dev/null; grep -oP ''https?://[^\s]+'' {workspace}/dirsearch.txt 2>/dev/null | grep -oP ''/[a-zA-Z0-9/_\-\.]+'' || true; jq -r ''.results[]?.url'' {workspace}/ffuf_paths.json 2>/dev/null | grep -oP ''/[a-zA-Z0-9/_\-\.]+'' || true; jq -r ''select(.type=="response" and .status!=404) | .url'' {workspace}/feroxbuster.json 2>/dev/null | grep -oP ''/[a-zA-Z0-9/_\-\.]+'' || true; grep -oP ''/[a-zA-Z0-9/_\-\.]+'' {workspace}/gobuster_dir.txt 2>/dev/null || true) | grep -vE ''^/$|^\.$'' | sort -u > {workspace}/all_endpoints.txt || true; touch {workspace}/all_endpoints.txt; printf ''Endpoints    : %s unique paths\n'' "$(wc -l < {workspace}/all_endpoints.txt)" >> {workspace}/stats.txt'
  outputs:
    endpoints: '{workspace}/all_endpoints.txt'
  _phase: process
- id: nuclei_paths
  name: '[nuclei] scan discovered endpoints for misconfigs + exposures'
  depends_on:
  - merge_endpoints
  when: '{vars.run_nuclei_js}'
  optional: true
  skip_if_exists: true
  timeout: 20m
  shell: true
  run: 'BASE=$(echo ''{target}'' | grep -oP ''https?://[^/]+''); test -s {workspace}/all_endpoints.txt && head -300 {workspace}/all_endpoints.txt | sed "s|^|$BASE|" | nuclei -t /root/nuclei-templates/http/exposures/ -rl {vars.nuclei_rl} -timeout {vars.nuclei_timeout} -silent -jsonl -o {workspace}/nuclei_paths.jsonl 2>/dev/null || true; touch {workspace}/nuclei_paths.jsonl; printf ''nuclei paths : %s findings\n'' "$(wc -l < {workspace}/nuclei_paths.jsonl)" >> {workspace}/stats.txt'
  outputs:
    results: '{workspace}/nuclei_paths.jsonl'
  _phase: vuln
- id: final_report
  name: final report — consolidate all findings
  run_on_failed_deps: true
  depends_on:
  - httpx_probe
  - merge_all_urls
  - subjs_collect
  - linkfinder_scan
  - jsapiscan_scan
  - jsubfinder_scan
  - secretfinder_scan
  - swaggerspy_scan
  - static_secret_scan
  - nuclei_js_secrets
  - gf_patterns
  - dirbrute
  - merge_endpoints
  - nuclei_paths
  shell: true
  run: 'TOTAL=$(wc -l < {workspace}/all_urls.txt 2>/dev/null || echo 0); JS=$(wc -l < {workspace}/js_urls.txt 2>/dev/null || echo 0); JSD=$(ls {workspace}/js_files/*.js 2>/dev/null | wc -l || echo 0); LF=$(wc -l < {workspace}/linkfinder_endpoints.txt 2>/dev/null || echo 0); JSAPI=$(wc -l < {workspace}/jsapiscan_results.txt 2>/dev/null || echo 0); JSUB_S=$(wc -l < {workspace}/jsubfinder_secrets.txt 2>/dev/null || echo 0); JSUB_D=$(wc -l < {workspace}/jsubfinder_subs.txt 2>/dev/null || echo 0); SWS_D=$(grep ''^URL: '' {workspace}/swaggerspy_results.txt 2>/dev/null | wc -l || echo 0); SWS_S=$(grep -E ''^\[\*\]'' {workspace}/swaggerspy_results.txt 2>/dev/null | grep -v ''Found'' | wc -l || echo 0); SF=$(wc -l < {workspace}/secretfinder_results.txt 2>/dev/null || echo 0); TH=$(wc -l < {workspace}/trufflehog_results.jsonl 2>/dev/null || echo 0); GL=$(jq ''if type=="array" then length else 0 end'' {workspace}/gitleaks_results.json 2>/dev/null || echo 0); NK=$(wc -l < {workspace}/nuclei_file_keys.jsonl 2>/dev/null || echo 0); NJ=$(wc -l < {workspace}/nuclei_js_exposure.jsonl 2>/dev/null || echo 0); NT=$(wc -l < {workspace}/nuclei_target_exposure.jsonl 2>/dev/null || echo 0); NP=$(wc -l < {workspace}/nuclei_paths.jsonl 2>/dev/null || echo 0); GF=$(cat {workspace}/gf/*.txt 2>/dev/null | wc -l || echo 0); DS=$(wc -l < {workspace}/dirsearch.txt 2>/dev/null || echo 0); FF=$(jq -r ''.results[]?.url'' {workspace}/ffuf_paths.json 2>/dev/null | wc -l || echo 0); FX=$(jq -r ''select(.type=="response" and .status!=404) | .url'' {workspace}/feroxbuster.json 2>/dev/null | wc -l || echo 0); GB=$(wc -l < {workspace}/gobuster_dir.txt 2>/dev/null || echo 0); EP=$(wc -l < {workspace}/all_endpoints.txt 2>/dev/null || echo 0); TECH=$(jq -r ''.tech[]?'' {workspace}/httpx_probe.jsonl 2>/dev/null | sort -u | tr ''\n'' '','' | sed ''s/,$//'' || echo ''?''); printf ''# JS & Secrets Recon — {target}\n\nTech: %s\n\n## Crawl\n- katana+hakrawler+gau+waymore+waybackurls+urlfinder: **%s** unique URLs\n\n## JS\n- JS URLs: %s | Downloaded: %s files\n- LinkFinder endpoints: %s\n- jsapiscan API endpoints: %s\n\n## Secrets\n- SecretFinder: **%s** findings\n- TruffleHog: **%s** secrets\n- Gitleaks: **%s** findings\n- jsubfinder: **%s** secrets / %s subdomains\n- SwaggerSpy   : **%s** SwaggerHub specs / **%s** secret matches\n- nuclei file/keys: **%s** findings\n- nuclei exposures (JS): %s | (target): %s | (paths): %s\n\n## GF Patterns\n- %s total matches (jsvar/params/lfi/ssrf/xss/sqli/idor/rce/redirect)\n\n## Dir Brute-force\n- dirsearch: %s | ffuf: %s | feroxbuster: %s | gobuster: %s\n- **Merged unique paths: %s**\n\n## Output Files\n- all_urls.txt, js_urls.txt, js_files/\n- linkfinder_endpoints.txt, jsapiscan_results.txt\n- secretfinder_results.txt, trufflehog_results.jsonl, gitleaks_results.json\n- jsubfinder_secrets.txt, swaggerspy_results.txt, nuclei_file_keys.jsonl, nuclei_js_exposure.jsonl, nuclei_paths.jsonl\n- gf/ (per-pattern), dirsearch.txt, ffuf_paths.json, feroxbuster.json, gobuster_dir.txt\n- all_endpoints.txt, report.md\n'' "$TECH" "$TOTAL" "$JS" "$JSD" "$LF" "$JSAPI" "$SF" "$TH" "$GL" "$JSUB_S" "$JSUB_D" "$SWS_D" "$SWS_S" "$NK" "$NJ" "$NT" "$NP" "$GF" "$DS" "$FF" "$FX" "$GB" "$EP" > {workspace}/report.md 2>/dev/null || true; echo '''' >> {workspace}/report.md; echo ''## Stats'' >> {workspace}/report.md; cat {workspace}/stats.txt >> {workspace}/report.md 2>/dev/null || true; cat {workspace}/report.md'
  _phase: report
