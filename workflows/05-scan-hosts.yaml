name: 05-scan-hosts
description: 'TARGETED host scan (NO passive discovery): resolve + httpx probe + port scan on a SPECIFIC host set you already found — set target_hosts (inline comma/space list) or subdomains_list (file path). For the agent to focus a run on hosts it saw in the graph instead of re-running the whole full-recon pipeline. Writes the canonical files (resolved/httpx.jsonl/naabu.jsonl/live_urls) so the graph + DB ingest picks the results up. Every host is still passed through the target scope filter.'
max_parallel: 4
vars:
  # the host set to scan — set AT LEAST one of these (the agent sets target_hosts):
  target_hosts: ''          # inline, comma/space/newline-separated hosts
  subdomains_list: ''       # OR a path to a file of hosts
  # EXTRA IPs/CIDRs to fold into the sweep: the LB / F5 / shared-hosting pool that
  # the in-scope names are VHOSTED on but never resolve to (operator vouches scope).
  # Comma/space-separated, IPs or CIDRs (e.g. '125.212.197.0/24, 103.1.208.5').
  target_ips: ''
  run_portscan: 'true'
  httpx_threads: '50'
  httpx_timeout: '10'
  web_ports: '80,443,8080,8443,8000,8888,3000,5000,9000,9443,2083,8006,10250'
  # vhost-matrix cross-product caps (name x IP). Raise for a big target so no
  # non-resolving name / IP is left untested; the step's 30m timeout still bounds it.
  # parallel probes for the vhost matrix (xargs -P). Higher = faster sweep.
  vhost_parallel: '50'
  vhost_max_names: '200'
  vhost_max_ips: '80'
  # true (default) -> sweep EVERY in-scope name — BOTH resolving ("alive") and
  # non-resolving ("dead") — against the IP set, because an alive name can still be
  # a distinct vhost on a DIFFERENT pool IP. Set false to test only non-resolving.
  vhost_all_names: 'true'
  # cap on how many IPs a single supplied CIDR may expand to (scope/runtime guard).
  ip_cidr_max: '512'
steps:
  - id: seed_hosts
    name: 'build the in-scope host set (target_hosts + subdomains_list, scope-filtered)'
    shell: true
    run: |
      : > {workspace}/scan_hosts.txt
      ( printf '%s\n' '{vars.target_hosts}' | tr ',;" ' '\n'
        test -n '{vars.subdomains_list}' && test -f '{vars.subdomains_list}' && cat '{vars.subdomains_list}' || true
        echo '{target}'
      ) | sed 's|https\?://||; s|/.*||; s|^\*\.||; s|\.$||; s|[[:space:]].*||' \
        | tr '[:upper:]' '[:lower:]' \
        | grep -E '^[a-z0-9][a-z0-9._-]*\.[a-z]{2,}$' \
        | awk -v t="{target}" '$0==t || (length($0)>length(t) && substr($0,length($0)-length(t))==("." t))' \
        | sort -u > {workspace}/scan_hosts.txt
      printf '[seed] %s in-scope hosts to scan\n' "$(wc -l < {workspace}/scan_hosts.txt)"
    outputs:
      hosts: '{workspace}/scan_hosts.txt'
  - id: resolve
    name: 'resolve hosts -> IPs (dnsx)'
    depends_on:
    - seed_hosts
    shell: true
    timeout: 15m
    run: |
      touch {workspace}/subdomains_resolved.txt {workspace}/resolved.txt {workspace}/unresolved_hosts.txt
      test -s {workspace}/scan_hosts.txt || exit 0
      # one dnsx pass -> IPs + which names resolved; the rest are vhost candidates.
      dnsx -l {workspace}/scan_hosts.txt -silent -a -resp 2>/dev/null > {workspace}/.dnsx || true
      grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' {workspace}/.dnsx | sort -u > {workspace}/resolved.txt || true
      awk '{print $1}' {workspace}/.dnsx | sort -u > {workspace}/.resolved_names
      comm -23 <(sort -u {workspace}/scan_hosts.txt) {workspace}/.resolved_names > {workspace}/.soft || true
      # SOFT recheck (disposition): a name that failed the bulk pass is often
      # SERVFAIL/timeout, NOT truly dead. Recheck each on 3 public resolvers before
      # calling it unresolved -> fewer false "dead" names handed to the vhost matrix.
      : > {workspace}/unresolved_hosts.txt
      while read n; do
        [ -n "$n" ] || continue
        got=""
        for srv in 8.8.8.8 1.0.0.1 9.9.9.9; do
          v=$(dig +short +time=3 +tries=1 "$n" A "@$srv" 2>/dev/null | grep -E '^[0-9]+\.' | head -1)
          [ -n "$v" ] && { echo "$v" >> {workspace}/resolved.txt; got=1; break; }
        done
        [ -z "$got" ] && echo "$n" >> {workspace}/unresolved_hosts.txt
      done < {workspace}/.soft
      sort -u -o {workspace}/resolved.txt {workspace}/resolved.txt
      cp {workspace}/scan_hosts.txt {workspace}/subdomains_resolved.txt
      rm -f {workspace}/.dnsx {workspace}/.resolved_names {workspace}/.soft
      printf '[resolve] %s IPs | %s hosts | %s unresolved after soft-recheck (-> vhost matrix)\n' \
        "$(wc -l < {workspace}/resolved.txt)" "$(wc -l < {workspace}/scan_hosts.txt)" "$(wc -l < {workspace}/unresolved_hosts.txt)"
      exit 0
    outputs:
      resolved: '{workspace}/resolved.txt'
  - id: collect_ips
    name: 'aggregate the IP set to sweep — resolved IPs + operator-supplied target_ips/CIDRs (scope-vouched)'
    depends_on:
    - resolve
    run_on_failed_deps: true
    shell: true
    timeout: 10m
    run: |
      touch {workspace}/scan_ips.txt {workspace}/target_ips_expanded.txt
      # 1) IPs the in-scope names resolved to (the "crown").
      cat {workspace}/resolved.txt 2>/dev/null > {workspace}/scan_ips.txt || true
      # 2) operator/agent-supplied IPs or CIDRs: the LB / F5 / shared pool the names
      #    are vhosted on but NEVER resolve to. This is exactly the gap that makes a
      #    name-resolved-only IP axis miss a vhost (e.g. owa.* served on an F5 pool IP
      #    no in-scope name points at). CIDRs expanded (mapcidr), bounded by ip_cidr_max.
      printf '%s\n' '{vars.target_ips}' | tr ',;" ' '\n' | sed 's/[[:space:]]//g' \
        | grep -E '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(/[0-9]{1,2})?$' \
        | while read entry; do
            [ -n "$entry" ] || continue
            case "$entry" in
              */*) if command -v mapcidr >/dev/null 2>&1; then
                     printf '%s\n' "$entry" | mapcidr -silent 2>/dev/null | head -{vars.ip_cidr_max}
                   else
                     printf '[collect-ips] mapcidr missing -> cannot expand %s\n' "$entry" >&2
                   fi ;;
              *)   printf '%s\n' "$entry" ;;
            esac
          done | sort -u > {workspace}/target_ips_expanded.txt || true
      cat {workspace}/target_ips_expanded.txt >> {workspace}/scan_ips.txt
      sort -u -o {workspace}/scan_ips.txt {workspace}/scan_ips.txt
      # feed the supplied pool IPs back into resolved.txt so the graph/DB ingest them.
      sort -u {workspace}/resolved.txt {workspace}/target_ips_expanded.txt -o {workspace}/resolved.txt 2>/dev/null || true
      printf '[collect-ips] %s IP(s) to sweep (resolved + %s supplied/expanded)\n' \
        "$(wc -l < {workspace}/scan_ips.txt)" "$(wc -l < {workspace}/target_ips_expanded.txt)"
      exit 0
    outputs:
      scan_ips: '{workspace}/scan_ips.txt'
      supplied_ips: '{workspace}/target_ips_expanded.txt'
  - id: ip_pivot
    name: 'IP-side pivot — cert SAN/CN (tlsx) + PTR (dnsx) on the aggregated IP set -> in-scope vhost names'
    depends_on:
    - collect_ips
    run_on_failed_deps: true
    shell: true
    timeout: 15m
    run: |
      touch {workspace}/ip_pivot_names.txt
      test -s {workspace}/scan_ips.txt || { printf '[ip-pivot] no IPs -> skip\n'; exit 0; }
      : > {workspace}/.pivot
      # cert SAN/CN names a host presents often has NO public DNS (vhost); PTR gives
      # the functional name. Run on the AGGREGATED IP set (incl. the supplied pool) so
      # the pool's cert SANs become new in-scope vhost candidates.
      cat {workspace}/scan_ips.txt | tlsx -san -cn -silent 2>/dev/null \
        | grep -oE '[a-z0-9._-]+\.[a-z]{2,}' >> {workspace}/.pivot || true
      cat {workspace}/scan_ips.txt | dnsx -ptr -resp-only -silent 2>/dev/null >> {workspace}/.pivot || true
      # keep ONLY in-scope names (== target or *.target); add the NEW ones to the
      # host set AND to the vhost candidate list (cert names may not resolve).
      tr '[:upper:]' '[:lower:]' < {workspace}/.pivot \
        | sed 's|^\*\.||; s|\.$||' \
        | awk -v t="{target}" '$0==t || (length($0)>length(t) && substr($0,length($0)-length(t))==("." t))' \
        | sort -u > {workspace}/ip_pivot_names.txt || true
      new=$(comm -23 {workspace}/ip_pivot_names.txt <(sort -u {workspace}/scan_hosts.txt))
      if [ -n "$new" ]; then
        printf '%s\n' "$new" >> {workspace}/scan_hosts.txt
        printf '%s\n' "$new" >> {workspace}/unresolved_hosts.txt
        sort -u -o {workspace}/scan_hosts.txt {workspace}/scan_hosts.txt
        sort -u -o {workspace}/unresolved_hosts.txt {workspace}/unresolved_hosts.txt
      fi
      rm -f {workspace}/.pivot
      printf '[ip-pivot] %s new in-scope name(s) from cert SAN + PTR\n' "$(printf '%s\n' "$new" | grep -c . 2>/dev/null || echo 0)"
      exit 0
    outputs:
      pivot_names: '{workspace}/ip_pivot_names.txt'
  - id: httpx_probe
    name: 'probe live web hosts (httpx -> httpx.jsonl + live_urls)'
    depends_on:
    - resolve
    run_on_failed_deps: true
    shell: true
    timeout: 20m
    run: |
      touch {workspace}/httpx.jsonl {workspace}/live_urls.txt {workspace}/all_urls.txt
      test -s {workspace}/scan_hosts.txt || exit 0
      httpx -l {workspace}/scan_hosts.txt -silent -json -o {workspace}/httpx.jsonl \
        -td -title -status-code -content-length -cname -follow-redirects -retries 2 \
        -timeout {vars.httpx_timeout} -threads {vars.httpx_threads} -random-agent 2>/dev/null || true
      jq -r '.url // empty' {workspace}/httpx.jsonl 2>/dev/null | sort -u > {workspace}/live_urls.txt || true
      cp {workspace}/live_urls.txt {workspace}/all_urls.txt
      printf '[httpx] %s live web hosts\n' "$(wc -l < {workspace}/live_urls.txt)"
      exit 0
    outputs:
      httpx_jsonl: '{workspace}/httpx.jsonl'
      live_urls: '{workspace}/live_urls.txt'
  - id: vhost_matrix
    name: 'vhost matrix — NO domain left behind: every name as Host vs every open-web IP (pool-aware, baseline-gated)'
    depends_on:
    - collect_ips
    - ip_pivot
    - httpx_probe
    - portscan
    run_on_failed_deps: true
    shell: true
    timeout: 30m
    run: |
      touch {workspace}/vhost_new_hosts.txt {workspace}/vhost_matrix_hits.txt
      # IP axis = EVERY web-serving IP this run saw, UNIONed from ALL sources so no IP
      # is left out:
      #   web_ips.txt  : naabu-confirmed open web port (hosts + aggregated pool)
      #   httpx.jsonl  : IPs httpx actually connected to (round-robin / edge IPs that
      #                  dnsx never returned — still real IPs serving an in-scope host)
      #   scan_ips.txt : resolved + operator-supplied pool (fallback when the above are
      #                  empty, e.g. portscan+httpx disabled)
      ipsrc={workspace}/vhost_ip_axis.txt
      : > "$ipsrc"
      cat {workspace}/web_ips.txt 2>/dev/null >> "$ipsrc" || true
      jq -r '([.a[]?] + [.host]) | .[]? // empty' {workspace}/httpx.jsonl 2>/dev/null >> "$ipsrc" || true
      grep -hoE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' "$ipsrc" | sort -u -o "$ipsrc" || true
      [ -s "$ipsrc" ] || cat {workspace}/scan_ips.txt 2>/dev/null >> "$ipsrc" || true
      [ -s "$ipsrc" ] || cat {workspace}/resolved.txt 2>/dev/null >> "$ipsrc" || true
      sort -u -o "$ipsrc" "$ipsrc" 2>/dev/null || true
      # name axis: by default test EVERY in-scope name — alive (resolving) AND dead
      # (non-resolving) — because an alive name can still be a distinct vhost on a
      # DIFFERENT IP. Set vhost_all_names=false (and no target_ips) for dead-only.
      namesrc={workspace}/unresolved_hosts.txt
      if [ -s {workspace}/target_ips_expanded.txt ] || [ "{vars.vhost_all_names}" = "true" ]; then
        namesrc={workspace}/scan_hosts.txt
      fi
      test -s "$namesrc" || { printf '[vhost-matrix] no names to test -> skip\n'; exit 0; }
      test -s "$ipsrc" || { printf '[vhost-matrix] no known IPs -> skip\n'; exit 0; }
      # Test each name as a Host/SNI against each IP (https then http). Bounded
      # cross-product (caps) so it can't blow the timeout.
      head -{vars.vhost_max_names} "$namesrc" > {workspace}/.vm_names
      head -{vars.vhost_max_ips} "$ipsrc" > {workspace}/.vm_ips
      printf '[vhost-matrix] names<-%s ips<-%s\n' "$namesrc" "$ipsrc"
      tot_n=$(wc -l < "$namesrc"); tot_i=$(wc -l < "$ipsrc")
      [ "$tot_n" -gt {vars.vhost_max_names} ] && printf '[vhost-matrix] NOTE: %s non-resolving names > cap %s — raise vhost_max_names to cover all\n' "$tot_n" "{vars.vhost_max_names}"
      [ "$tot_i" -gt {vars.vhost_max_ips} ] && printf '[vhost-matrix] NOTE: %s IPs > cap %s — raise vhost_max_ips to cover all\n' "$tot_i" "{vars.vhost_max_ips}"
      # --- signature-based, PARALLEL vhost probe ---
      # signature(host,ip) = "code|sizebucket|title" via GET; compared against the
      # IP's catch-all baseline so a distinct vhost is caught even when it returns the
      # SAME status as the default (status-only missed those). Parse status from the
      # HTTP line (never the curl -w percent-brace write-out, itself a template token);
      # use [0-9][0-9][0-9] for exactly 3 digits (a braced quantifier is one too).
      cat > {workspace}/.vm_sig.sh <<'SIG'
      #!/bin/sh
      host="$1"; ip="$2"
      o=$(curl -sk -i --resolve "$host:443:$ip" --max-time 6 "https://$host/" 2>/dev/null)
      [ -z "$o" ] && o=$(curl -s -i --resolve "$host:80:$ip" --max-time 6 "http://$host/" 2>/dev/null)
      [ -z "$o" ] && { printf '|0|'; exit 0; }
      c=$(printf '%s' "$o" | grep -aoE 'HTTP/[0-9.]+ [0-9][0-9][0-9]' | head -1 | grep -oE '[0-9][0-9][0-9]$')
      n=$(printf '%s' "$o" | wc -c | tr -d ' ')
      bk=$(( n / 512 ))
      t=$(printf '%s' "$o" | tr -d '\r' | grep -aoiE '<title[^>]*>[^<]*' | head -1 | sed 's/<[^>]*>//' | cut -c1-60 | tr '|' ' ')
      printf '%s|%s|%s' "$c" "$bk" "$t"
      SIG
      cat > {workspace}/.vm_base.sh <<'BASE'
      #!/bin/sh
      ip="$1"
      r="rnd$$-$RANDOM.invalid"
      printf '%s|%s\n' "$ip" "$(sh {workspace}/.vm_sig.sh "$r" "$ip")" >> {workspace}/.vm_base
      BASE
      cat > {workspace}/.vm_probe.sh <<'PROBE'
      #!/bin/sh
      ip="$1"; name="$2"
      s=$(sh {workspace}/.vm_sig.sh "$name" "$ip")
      code=$(printf '%s' "$s" | cut -d'|' -f1)
      [ -z "$code" ] && exit 0
      case "$code" in 2*|3*|401|403|405) : ;; *) exit 0 ;; esac
      base=$(grep -F "$ip|" {workspace}/.vm_base 2>/dev/null | head -1 | cut -d'|' -f2-)
      [ -n "$base" ] && [ "$s" = "$base" ] && exit 0
      printf '%s [%s] %s (base %s)\n' "$name" "$ip" "$code" "${base:-none}" >> {workspace}/vhost_matrix_hits.txt
      printf '%s\n' "$name" >> {workspace}/vhost_new_hosts.txt
      PROBE
      # phase 1: catch-all baseline per IP (parallel)
      : > {workspace}/.vm_base
      grep -E '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' {workspace}/.vm_ips \
        | xargs -P {vars.vhost_parallel} -n 1 sh {workspace}/.vm_base.sh 2>/dev/null || true
      # phase 2: name x IP cross-product, probed in parallel
      : > {workspace}/.vm_pairs
      while read ip; do
        echo "$ip" | grep -qE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' || continue
        while read name; do [ -n "$name" ] && printf '%s %s\n' "$ip" "$name"; done < {workspace}/.vm_names
      done < {workspace}/.vm_ips > {workspace}/.vm_pairs
      xargs -P {vars.vhost_parallel} -n 2 sh {workspace}/.vm_probe.sh < {workspace}/.vm_pairs 2>/dev/null || true
      sort -u -o {workspace}/vhost_new_hosts.txt {workspace}/vhost_new_hosts.txt
      rm -f {workspace}/.vm_names {workspace}/.vm_ips {workspace}/.vm_pairs {workspace}/.vm_base {workspace}/.vm_sig.sh {workspace}/.vm_base.sh {workspace}/.vm_probe.sh
      printf '[vhost-matrix] %s live vhost hit(s) (answered differently from catch-all on a known IP) -> vhost_new_hosts.txt\n' \
        "$(wc -l < {workspace}/vhost_matrix_hits.txt)"
      exit 0
    outputs:
      hits: '{workspace}/vhost_matrix_hits.txt'
      new_hosts: '{workspace}/vhost_new_hosts.txt'
  - id: portscan
    name: 'port scan hosts + aggregated IPs (naabu) -> open web IPs for the vhost sweep'
    depends_on:
    - collect_ips
    run_on_failed_deps: true
    when: '{vars.run_portscan}'
    optional: true
    shell: true
    timeout: 40m
    run: |
      touch {workspace}/naabu.jsonl {workspace}/web_ips.txt
      # scan the hostnames (passive + web ports)...
      if [ -s {workspace}/scan_hosts.txt ]; then
        naabu -list {workspace}/scan_hosts.txt -passive -json -silent 2>/dev/null >> {workspace}/naabu.jsonl || true
        naabu -list {workspace}/scan_hosts.txt -p {vars.web_ports} -json -silent -retries 2 2>/dev/null >> {workspace}/naabu.jsonl || true
      fi
      # ...AND the aggregated IP set (the pool IPs no name resolves to). This is what
      # tells the vhost matrix which pool IPs actually serve web.
      if [ -s {workspace}/scan_ips.txt ]; then
        naabu -list {workspace}/scan_ips.txt -p {vars.web_ports} -json -silent -retries 2 2>/dev/null >> {workspace}/naabu.jsonl || true
      fi
      # derive the IPs with an open WEB port -> the axis the vhost matrix sweeps.
      jq -r 'select(.port as $p | [{vars.web_ports}] | index($p)) | .ip // empty' {workspace}/naabu.jsonl 2>/dev/null \
        | grep -E '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' | sort -u > {workspace}/web_ips.txt || true
      printf '[naabu] %s port records | %s IP(s) with an open web port\n' \
        "$(wc -l < {workspace}/naabu.jsonl)" "$(wc -l < {workspace}/web_ips.txt)"
      exit 0
    outputs:
      naabu_jsonl: '{workspace}/naabu.jsonl'
      web_ips: '{workspace}/web_ips.txt'
  - id: final_report
    name: 'targeted scan summary'
    depends_on:
    - httpx_probe
    - vhost_matrix
    - portscan
    run_on_failed_deps: true
    shell: true
    run: |
      printf '[scan-hosts] hosts=%s live=%s vhosts=%s port_records=%s\n' \
        "$(wc -l < {workspace}/scan_hosts.txt 2>/dev/null || echo 0)" \
        "$(wc -l < {workspace}/live_urls.txt 2>/dev/null || echo 0)" \
        "$(wc -l < {workspace}/vhost_new_hosts.txt 2>/dev/null || echo 0)" \
        "$(wc -l < {workspace}/naabu.jsonl 2>/dev/null || echo 0)"
      exit 0
